document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ion:background .12s}\n  .stnav:hover{background:var(--paper-2)}\n  .racemeta{display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap}\n  .rmitem{display:flex; flex-direction:column; gap:4px}\n  .rmitem .k{font-family:'Archivo',sans-serif; font-weight:600; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}\n  .rmitem .v{font-family:'Archivo',sans-serif; font-weight:600; font-size:13.5px; color:var(--navy); line-height:1.2}\n  .rmitem .v.small{font-size:12px; color:var(--ink-2); font-weight:500}\n  .rating{display:inline-flex; align-items:center; gap:8px; font-family:'Archivo',sans-serif; font-weight:700; font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:8px 13px; border-radius:2px; border:1px solid}\n  .rating .rdot{width:9px; height:9px; border-radius:50%}\n  .r-safe-r,.r-likely-r,.r-lean-r{color:var(--rep); border-color:rgba(168,62,53,.4); background:rgba(168,62,53,.08)}\n  .r-safe-r .rdot{background:var(--rep)} .r-likely-r .rdot{background:var(--rep); opacity:.7} .r-lean-r .rdot{background:var(--rep); opacity:.45}\n  .r-safe-d,.r-likely-d,.r-lean-d{color:var(--dem); border-color:rgba(59,95,149,.4); background:rgba(59,95,149,.08)}\n  .r-safe-d .rdot{background:var(--dem)} .r-likely-d .rdot{background:var(--dem); opacity:.7} .r-lean-d .rdot{background:var(--dem); opacity:.45}\n  .r-tossup{color:#6d5a86; border-color:rgba(109,90,134,.45); background:rgba(109,90,134,.09)}\n  .r-tossup .rdot{background:#6d5a86}\n\n  /* One vote */\n  .ov{display:flex; flex-direction:column; gap:0; border:1px solid var(--line); border-radius:2px; background:var(--card)}\n  .ov .row{display:grid; grid-template-columns:210px 120px minmax(0,1fr); gap:20px; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line-2)}\n  .ov .row:last-child{border-bottom:0}\n  .ov .who .rn{font-family:'Playfair Display',serif; font-weight:600; font-size:17px; color:var(--ink); line-height:1.18}\n  .ov .who .yr{font-family:'Archivo',sans-serif; font-weight:600; font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin-top:4px}\n  .ov .margin{text-align:right}\n  .ov .margin .m{font-family:'Playfair Display',serif; font-weight:800; font-size:46px; line-height:.86; color:var(--red)}\n  .ov .margin .mk{font-family:'Archivo',sans-serif; font-weight:500; font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-top:3px}\n  .ov .viz .sliverbar{height:12px; background:var(--paper-2); border-radius:2px; position:relative; overflow:hidden}\n  .ov .viz .sliver{position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); background:var(--red); min-width:2px}\n  .ov .viz .conseq{margin-top:8px; font-size:12.5px; color:var(--ink-2); line-height:1.4}\n  .ov .viz .tot{font-family:'Archivo',sans-serif; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-top:4px}\n\n  /* Turnout dot field */\n  .drop{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}\n  .dcol .dhead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px}\n  .dcol .dpct{font-family:'Playfair Display',serif; font-weight:800; font-size:48px; line-height:.86; color:var(--navy)}\n  .dcol.focus .dpct{color:var(--red)}\n  .dcol .dwhat{font-family:'Archivo',sans-serif; font-weight:600; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); text-align:right; line-height:1.5}\n  .dots{display:grid; grid-template-columns:repeat(10,1fr); gap:5px}\n  .dots span{aspect-ratio:1/1; border-radius:50%; background:var(--paper-2)}\n  .dots span.on{background:var(--navy)}\n  .dcol.focus .dots span.on{background:var(--red)}\n  .dcap{margin-top:12px; font-size:12px; color:var(--ink-2); line-height:1.45}\n\n  /* CTA */\n  .cta{border:1px solid var(--line); border-top:3px solid var(--red); border-radius:2px; background:linear-gradient(180deg,#edf1f1,#f7f4ed); color:var(--ink); padding:32px; display:grid; grid-template-columns:1.1fr 1fr 1fr 1fr; gap:24px; align-items:start}\n  .cta h3{font-family:'Playfair Display',serif; font-weight:800; font-size:38px; margin:0 0 10px; line-height:.98; letter-spacing:-.01em; color:var(--navy)}\n  .cta .lead{font-family:'Playfair Display',serif; font-weight:400; font-size:15px; line-height:1.5; color:var(--ink-2); margin:0}\n  .cta .act h4{font-family:'Archivo',sans-serif; font-weight:600; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}\n  .cta .act a{display:inline-block; font-family:'Playfair Display',serif; font-weight:600; font-size:17px; color:var(--navy); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:1px}\n  .cta .act a:hover{color:var(--red); border-color:var(--red)}\n  .cta .act p{margin:6px 0 0; font-size:11.5px; color:var(--muted); line-height:1.4}\n\n  /* Footer */\n  footer{border-top:2px solid var(--navy); margin-top:30px; padding:28px 0 48px}\n  .foot-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:28px}\n  .foot-grid h4{font-family:'Archivo',sans-serif; font-weight:600; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 12px}\n  .foot-grid p{margin:0 0 7px; font-size:12.5px; color:var(--ink-2); line-height:1.5}\n  .foot-grid a{color:var(--navy); text-decoration:none; border-bottom:1px solid var(--line)}\n  .foot-grid a:hover{color:var(--red)}\n  .sig{font-family:'Playfair Display',serif; font-style:italic; font-weight:400; font-size:15px; color:var(--muted); margin-top:12px}\n  .disclaim{margin-top:24px; padding-top:16px; border-top:1px solid var(--line-2); font-family:'Archivo',sans-serif; font-size:11px; letter-spacing:.02em; color:var(--muted); line-height:1.7}\n\n  :focus-visible{outline:2px solid var(--red); outline-offset:2px}\n\n  @media (max-width:1080px){\n    .cta{grid-template-columns:1fr 1fr}\n    .cands{grid-template-columns:1fr 1fr}\n    .foot-grid{grid-template-columns:1fr 1fr}\n  }\n  @media (max-width:820px){\n    .wrap{padding:0 20px}\n    .spread{grid-template-columns:1fr}\n    .rail{border-right:0; border-bottom:1px solid var(--line); padding:20px 0 22px}\n    .stage{padding:22px 0}\n    #usmap{min-height:320px}\n    .la-grid .side{grid-template-columns:1fr}\n    .la-grid .side .blk2 + .blk2{border-left:0; border-top:1px solid var(--line-2)}\n    .drop{grid-template-columns:1fr}\n    .ov .row{grid-template-columns:1fr; gap:10px}\n    .ov .margin{text-align:left}\n    .cta{grid-template-columns:1fr}\n  }\n  @media (max-width:560px){\n    .cands{grid-template-columns:1fr}\n    .foot-grid{grid-template-columns:1fr}\n    .brand .mark{font-size:34px}\n    .countdown{text-align:left}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n\n  <!-- MASTHEAD -->\n  <div class=\"flag-rule\"><span class=\"ln\"><\u002Fspan><span class=\"stars\">★ ★ ★<\u002Fspan><span class=\"ln red\"><\u002Fspan><\u002Fdiv>\n  <header class=\"masthead\">\n    <div class=\"mast-top\">\n      <div class=\"brand\">\n        <div class=\"mark disp\">EveryMoment<span class=\"now\">Votes<\u002Fspan><\u002Fdiv>\n        <div class=\"tag\">Non-partisan · 2026 Midterm Elections · November 3<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"countdown\">\n        <div class=\"num tnum disp\" id=\"cd-num\">—<\u002Fdiv>\n        <div class=\"lab\">Days to <b>Election Day<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"srcline\">Data · <b>U.S. Census Bureau<\u002Fb> · <b>U.S. Elections Project<\u002Fb> · <b>Pew Research<\u002Fb> · <b>Ballotpedia<\u002Fb> · <b>Louisiana Secretary of State<\u002Fb><\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"hero\">\n    <p class=\"serif\">Every seat in the House. A third of the Senate. Thirty-nine governors. And in <span class=\"b\">Louisiana<\u002Fspan> — where barely <em>one in three<\u002Fem> eligible voters cast a ballot last midterm — a plain reminder of what a single vote is worth.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- SPREAD: national map + rail -->\n  <div class=\"spread\">\n    <aside class=\"rail\">\n      <div class=\"mod\">\n        <span class=\"lab eyebrow\">On the ballot · Nov 3<\u002Fspan>\n        <div class=\"bignum tnum\">435<\u002Fdiv>\n        <div class=\"subnote\">U.S. House seats — the entire chamber — are up for election, alongside 35 Senate seats and 39 governorships.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mod\">\n        <div class=\"trio\">\n          <div class=\"m\"><div class=\"v tnum\">35<\u002Fdiv><div class=\"k\">Senate seats<\u002Fdiv><\u002Fdiv>\n          <div class=\"m\"><div class=\"v tnum\">39<\u002Fdiv><div class=\"k\">Governors<\u002Fdiv><\u002Fdiv>\n          <div class=\"m\"><div class=\"v tnum\">4<\u002Fdiv><div class=\"k\">Seats to flip Senate<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mod\">\n        <span class=\"lab eyebrow\">Turnout, by election type<\u002Fspan>\n        <div class=\"barrow\">\n          <div class=\"brow\"><div class=\"top\"><span>2020 · Presidential<\u002Fspan><span class=\"v tnum\">66%<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:66%;background:var(--navy)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"brow\"><div class=\"top\"><span>2018 · Midterm<\u002Fspan><span class=\"v tnum\">49%<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:49%;background:var(--navy-2)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"brow\"><div class=\"top\"><span>2022 · Midterm<\u002Fspan><span class=\"v tnum\">46%<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:46%;background:var(--steel)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"brow\"><div class=\"top\"><span>2022 · Louisiana<\u002Fspan><span class=\"v tnum\" style=\"color:var(--red)\">≈33%<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:33%;background:var(--red)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mod\">\n        <span class=\"lab eyebrow\">Registered, but absent<\u002Fspan>\n        <div class=\"bignum tnum red\">1 in 4<\u002Fdiv>\n        <div class=\"subnote\">Registered voters who skipped the 2022 midterm nationally. The race is often decided by those who don't show up.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <div class=\"stage\">\n      <div class=\"stage-head\">\n        <span class=\"t disp\">Where the country votes<\u002Fspan>\n        <span class=\"eyebrow\">Dot = state · size = U.S. House seats · colour = Senate race in 2026<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mapwrap\">\n        <div id=\"usmap\" role=\"application\" aria-label=\"Interactive map of 2026 U.S. races by state\"><\u002Fdiv>\n        <div id=\"mapboot\" class=\"mapboot\">Loading map…<\u002Fdiv>\n        <div id=\"usfallback\">\n          <svg class=\"vmap\" id=\"ussvg\" viewBox=\"0 0 960 600\" role=\"img\" aria-label=\"Map of the United States with a dot for each state, sized by House seats and coloured by whether a Senate seat is up in 2026\"><\u002Fsvg>\n          <div class=\"tip\" id=\"ustip\" role=\"status\" aria-live=\"polite\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"legend\">\n        <div class=\"grp\">\n          <span class=\"lab eyebrow\">Governor's party<\u002Fspan>\n          <div class=\"keys\">\n            <span class=\"key\"><span class=\"sw\" style=\"background:var(--dem)\"><\u002Fspan> Democratic<\u002Fspan>\n            <span class=\"key\"><span class=\"sw\" style=\"background:var(--rep)\"><\u002Fspan> Republican<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grp\">\n          <span class=\"lab eyebrow\">Ring style<\u002Fspan>\n          <div class=\"keys\">\n            <span class=\"key\"><span class=\"ring solid\"><\u002Fspan> Senate seat up in 2026<\u002Fspan>\n            <span class=\"key\"><span class=\"ring dashed\"><\u002Fspan> House races only<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grp\">\n          <span class=\"lab eyebrow\">U.S. House seats<\u002Fspan>\n          <div class=\"sizekeys\">\n            <div class=\"sz\"><span class=\"cir\" style=\"width:8px;height:8px\"><\u002Fspan><span>1<\u002Fspan><\u002Fdiv>\n            <div class=\"sz\"><span class=\"cir\" style=\"width:15px;height:15px\"><\u002Fspan><span>14<\u002Fspan><\u002Fdiv>\n            <div class=\"sz\"><span class=\"cir\" style=\"width:24px;height:24px\"><\u002Fspan><span>52<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grp\">\n          <span class=\"lab eyebrow\">Focus<\u002Fspan>\n          <div class=\"keys\"><span class=\"key\"><span class=\"ring focus\"><\u002Fspan> Louisiana<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- LOUISIANA detail -->\n      <div class=\"stage-head detail-head\">\n        <span class=\"t disp\">Louisiana, parish by parish<\u002Fspan>\n        <span class=\"eyebrow\">Dot = parish · size = registered voters · colour = turnout<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"la-grid\">\n        <div class=\"lamap\">\n          <svg class=\"vmap\" id=\"lasvg\" viewBox=\"0 0 820 560\" role=\"img\" aria-label=\"Map of Louisiana's 64 parishes, each a dot sized by registered voters and coloured by turnout\"><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"side\">\n          <div class=\"blk2\">\n            <span class=\"lab eyebrow\">Registered voters<\u002Fspan>\n            <div class=\"big tnum\">≈3.0<span class=\"u\">million · 64 parishes<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"blk2\">\n            <span class=\"lab eyebrow\">2022 midterm turnout<\u002Fspan>\n            <div class=\"big red tnum\">≈33%<\u002Fdiv>\n            <p class=\"note\" style=\"margin-top:8px\">Among the lowest in the nation — roughly <b>one in three<\u002Fb> eligible voters. <span style=\"color:var(--muted)\">Pew Research, U.S. Elections Project.<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n          <div class=\"blk2\">\n            <span class=\"lab eyebrow\">A rewritten ballot<\u002Fspan>\n            <p class=\"note\">For 2026 Louisiana replaced its 50-year-old <b>jungle primary<\u002Fb> with closed party primaries. In the first test, two-term Sen. <b>Bill Cassidy<\u002Fb> was knocked out — the Secretary of State projected turnout as low as <b>20–25%<\u002Fb>. <span style=\"color:var(--muted)\">Ballotpedia, Louisiana Illuminator.<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CANDIDATES -->\n  <section class=\"blk\" id=\"ballot\">\n    <div class=\"blk-head\"><span class=\"t disp\">The Senate ballot, state by state<\u002Fspan><span class=\"eyebrow\">All 35 seats up · Nov 3, 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"statebar\">\n      <div class=\"stsel-wrap\">\n        <span class=\"eyebrow\">Select a state<\u002Fspan>\n        <div class=\"selrow\">\n          <button class=\"stnav\" id=\"stprev\" type=\"button\" aria-label=\"Previous state\">‹<\u002Fbutton>\n          <select id=\"stsel\" aria-label=\"Select a state\"><\u002Fselect>\n          <button class=\"stnav\" id=\"stnext\" type=\"button\" aria-label=\"Next state\">›<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"racemeta\" id=\"racemeta\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"blk-sub serif\" id=\"ballot-sub\"><\u002Fp>\n    <div class=\"cands\" id=\"cands\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WHAT ONE VOTE CAN DO -->\n  <section class=\"blk\">\n    <div class=\"blk-head\"><span class=\"t disp\">What one vote can do<\u002Fspan><span class=\"eyebrow\">Margins that changed the outcome<\u002Fspan><\u002Fdiv>\n    <p class=\"blk-sub serif\">Since 1976, more than 85 U.S. Senate elections were decided by less than three percent of the vote. A handful of these came down to a margin you could fit in a single precinct.<\u002Fp>\n    <div class=\"ov\" id=\"ovlist\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TURNOUT DROP-OFF -->\n  <section class=\"blk\">\n    <div class=\"blk-head\"><span class=\"t disp\">The missing voters<\u002Fspan><span class=\"eyebrow\">Of every 100 eligible Americans<\u002Fspan><\u002Fdiv>\n    <p class=\"blk-sub serif\">Turnout falls sharply from presidential years to midterms — and further still in Louisiana. Each dot is one of 100 eligible voters. The filled ones showed up.<\u002Fp>\n    <div class=\"drop\" id=\"dropfield\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section class=\"blk\">\n    <div class=\"cta\">\n      <div>\n        <h3 class=\"disp\">Now is the part<br>you control.<\u002Fh3>\n        <p class=\"lead\">Registering takes minutes. Confirm you're on the rolls, find your ballot, and make a plan to vote.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"act\">\n        <h4>Register<\u002Fh4>\n        <a href=\"https://vote.gov\" target=\"_blank\" rel=\"noopener\">vote.gov ↗<\u002Fa>\n        <p>Official federal portal. Routes you to your state.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"act\">\n        <h4>Check · Louisiana<\u002Fh4>\n        <a href=\"https://voterportal.sos.la.gov\" target=\"_blank\" rel=\"noopener\">GeauxVote ↗<\u002Fa>\n        <p>Confirm registration, party, and your polling place.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"act\">\n        <h4>Your ballot<\u002Fh4>\n        <a href=\"https://www.sos.la.gov/ElectionsAndVoting\" target=\"_blank\" rel=\"noopener\">LA Secretary of State ↗<\u002Fa>\n        <p>Sample ballots, deadlines, and early-voting dates.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer>\n    <div class=\"foot-grid\">\n      <div>\n        <h4>EveryMomentVotes<\u002Fh4>\n        <p>A non-partisan look at the 2026 midterms, built to connect the national picture to the ballot in front of you. No endorsements, no ratings — just sourced numbers and where to act on them.<\u002Fp>\n        <p class=\"sig\">One ballot is never just one ballot.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4>Sources<\u002Fh4>\n        <p><a href=\"https://www.census.gov/topics/public-sector/voting.html\" target=\"_blank\" rel=\"noopener\">U.S. Census Bureau — Voting &amp; Registration<\u002Fa><\u002Fp>\n        <p><a href=\"https://www.electproject.org\" target=\"_blank\" rel=\"noopener\">United States Elections Project<\u002Fa><\u002Fp>\n        <p><a href=\"https://www.pewresearch.org\" target=\"_blank\" rel=\"noopener\">Pew Research Center<\u002Fa><\u002Fp>\n        <p><a href=\"https://ballotpedia.org\" target=\"_blank\" rel=\"noopener\">Ballotpedia<\u002Fa> · <a href=\"https://www.sos.la.gov\" target=\"_blank\" rel=\"noopener\">Louisiana Secretary of State<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4>Also cited<\u002Fh4>\n        <p><a href=\"https://www.fec.gov\" target=\"_blank\" rel=\"noopener\">Federal Election Commission<\u002Fa><\u002Fp>\n        <p><a href=\"https://www.eac.gov\" target=\"_blank\" rel=\"noopener\">U.S. Election Assistance Commission<\u002Fa><\u002Fp>\n        <p><a href=\"https://electionlab.mit.edu\" target=\"_blank\" rel=\"noopener\">MIT Election Data &amp; Science Lab<\u002Fa><\u002Fp>\n        <p><a href=\"https://www.npr.org/2018/11/03/663709392\" target=\"_blank\" rel=\"noopener\">NPR — close-margin elections<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"disclaim\">Design prototype. Race facts reflect Ballotpedia, Wikipedia, and news reporting as of early July 2026; national turnout figures are from Pew Research and the U.S. Elections Project; the Louisiana statewide turnout figure (~33%, 2022) is from Pew's analysis of official returns. Parish-level dot sizes and turnout shading are illustrative for the design. Historic-margin figures are from NPR, the Center for American Progress, and Wikipedia's list of close election results. This site makes no endorsement and takes no position on any candidate, party, or measure.<\u002Fp>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<script>\nconst ELECT = {\"us\":{\"W\":960,\"H\":600,\"statesPath\":\"M178.596,529.834L178.658,529.885L179.389,530.091L180.073,530.281L180.561,531.136L181.396,531.686L182.034,532.104L182.647,532.501L183.527,533.068L184.145,533.464L184.972,533.988L185.465,534.298L185.853,535.045L186.321,535.941L186.324,536.541L186.661,536.552L187.112,535.763L187.585,535.223L188.167,534.555L188.557,534.103L189.437,533.851L189.604,532.792L189.247,531.465L189.696,531.367L189.907,531.116L189.916,530.696L189.492,530.24L190.259,529.763L190.811,529.416L191.532,528.687L192.233,527.973L192.737,528.227L193.235,528.469L194.259,529.099L194.373,529.29L194.438,529.707L194.48,530.132L195.287,531.119L195.46,531.204L195.897,531.244L196.476,531.478L196.779,531.739L197.612,532.048L197.792,532.227L197.961,532.552L198.162,532.815L198.354,532.989L198.569,533.254L198.974,533.52L199.659,533.745L200.135,533.9L200.803,534.116L201.606,534.73L202.306,535.262L203.074,535.762L203.165,536.327L203.994,536.98L204.929,537.847L205.692,538.636L206.189,539.054L206.83,539.684L207.617,540.454L208.515,541.327L209.162,541.863L210.031,542.624L210.494,543.096L210.44,543.545L210.372,544.1L211.16,544.086L211.706,544.074L211.765,544.647L211.841,545.402L212.495,545.486L212.94,545.542L212.989,545.936L213.342,546.278L213.615,546.952L214.284,546.669L214.58,546.543L215.096,546.703L215.778,546.913L216.453,547.095L217.03,547.249L217.705,547.219L218.553,547.218L219.124,547.638L219.896,547.624L220.438,548.305L221.335,548.295L221.73,547.93L222.015,548.183L222.284,548.496L222.492,548.941L222.617,549.404L222.559,549.852L222.561,550.311L222.622,550.782L222.759,551.261L222.97,551.749L223.214,552.152L223.763,552.862L224.03,553.322L224.165,553.645L224.046,555.004L224.061,555.625L224 0].properties;\n        const gov=p.gov==='D'?'Democratic':p.gov==='R'?'Republican':'—';\n        popup.setLngLat(e.features[0].geometry.coordinates).setHTML(\n          '<div class=\"pn\">'+p.name+'<\u002Fdiv>'+\n          '<div class=\"pr\"><span>Governor<\u002Fspan><span>'+gov+'<\u002Fspan><\u002Fdiv>'+\n          '<div class=\"pr\"><span>House seats<\u002Fspan><span>'+p.seats+'<\u002Fspan><\u002Fdiv>'+\n          '<div class=\"pr\"><span>Senate race · 2026<\u002Fspan><span>'+(p.senate?'Yes':'No')+'<\u002Fspan><\u002Fdiv>').addTo(map);});\n      map.on('mouseleave',layer,()=>{map.getCanvas().style.cursor=''; popup.remove();});\n    });\n  });\n  map.on('error',e=>{const m=(e&&e.error&&(e.error.message||''))||'',st=e&&e.error&&(e.error.status||e.error.statusCode);\n    if(st===401||st===403||/401|403|token|unauthor|access token/i.test(m)||!mapOK){try{map.remove();}catch(_){} fallback();}});\n  setTimeout(()=>{ if(!mapOK) fallback(); },2500);\n})();\n\n/* ---------- US SVG fallback ---------- */\nfunction renderUSsvg(){\n  const svg=document.getElementById('ussvg'); if(!svg||svg.__done) return; svg.__done=1;\n  const U=ELECT.us;\n  const tip=document.getElementById('ustip'), wrap=tip.parentElement;\n  const partyCol=g=>g==='D'?'var(--dem)':g==='R'?'var(--rep)':'var(--muted)';\n  let s=`<path d=\"${U.statesPath}\" fill=\"#e7e2d6\" stroke=\"rgba(34,37,43,.22)\" stroke-width=\"0.7\"/>`;\n  U.states.forEach(st=>{\n    const col=partyCol(st.gov);\n    const Rout=(6+Math.sqrt(st.seats)*3.1), Rin=Rout*0.36;\n    const dash=st.senate?'':'2,2', op=st.senate?0.85:0.45;\n    s+=`<g class=\"st\" data-n=\"${st.name}\" data-s=\"${st.seats}\" data-se=\"${st.senate}\" data-g=\"${st.gov}\">`;\n    s+=`<circle cx=\"${st.cx}\" cy=\"${st.cy}\" r=\"${Rout.toFixed(1)}\" fill=\"${col}\" fill-opacity=\"0.07\" stroke=\"${col}\" stroke-opacity=\"${op}\" stroke-width=\"${st.senate?1.4:1}\" stroke-dasharray=\"${dash}\"/>`;\n    s+=`<circle cx=\"${st.cx}\" cy=\"${st.cy}\" r=\"${Rin.toFixed(1)}
