<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPEC//FORGE — cyberpunk asset generator</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --line:#242c37; --line-soft:#1c232c;
    --ink:#e6ebf2; --dim:#8b97a8; --faint:#5a6675;
    --accent:#5ec8f5; --accent-b:#4ee0c1;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

  /* ---------- control rail ---------- */
  .rail{background:var(--panel);border-right:1px solid var(--line);padding:18px;overflow-y:auto;max-height:100vh}
  .brand{font-size:15px;font-weight:700;letter-spacing:-0.02em;margin-bottom:2px}
  .brand span{color:var(--accent-b)}
  .tag{font-size:9.5px;color:var(--faint);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:20px}
  .grp{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
  .grp:last-child{border:0}
  .lbl{font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:block}
  select,input[type=text],textarea{
    width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:3px;padding:7px 8px;font-family:var(--mono);font-size:11px;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.5}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:6px}
  .row>*{flex:1}
  button{
    background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;
    padding:8px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:0.06em;cursor:pointer;
    text-transform:uppercase;transition:border-color .15s,background .15s,color .15s;
  }
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#07222e;font-weight:700}
  button.primary:hover{background:var(--accent-b);border-color:var(--accent-b);color:#04231c}
  .hint{font-size:9.5px;color:var(--faint);line-height:1.6;margin-top:8px}

  /* ---------- symbol library ---------- */
  .symgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:9px}
  .sym{
    position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:3px;
    display:grid;place-items:center;cursor:pointer;background:var(--bg);
  }
  .sym svg{width:64%;height:64%}
  .sym[data-on="0"]{opacity:.25}
  .sym:hover{border-color:var(--accent)}
  .sym .x{
    position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;
    background:#c0392b;color:#fff;font-size:9px;line-height:14px;text-align:center;display:none;
  }
  .sym:hover .x{display:block}

  /* ---------- stage ---------- */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:14px;overflow:auto}
  #out{max-width:100%;max-height:74vh;box-shadow:0 18px 60px rgba(0,0,0,.55)}
  #out svg{display:block;max-width:100%;height:auto}
  .meta{font-size:10px;color:var(--faint);letter-spacing:0.08em}
  .meta b{color:var(--dim);font-weight:400}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">SPEC<span>//</span>FORGE</div>
    <div class="tag">procedural asset generator</div>

    <div class="grp">
      <label class="lbl">Format</label>
      <select id="format">
        <option value="poster">Poster · 1080 × 1080</option>
        <option value="wide">Wide · 1600 × 900</option>
        <option value="tight">Tight card · auto</option>
        <option value="sheet">Contact sheet · 4 × 5</option>
      </select>
    </div>

    <div class="grp">
      <label class="lbl">Palette</label>
      <select id="theme">
        <option value="random">Random</option>
      </select>
    </div>

    <div class="grp">
      <label class="lbl">Layout</label>
      <select id="arch">
        <option value="random">Random</option>
        <option value="brief">Brief — title + pills</option>
        <option value="spec">Spec — data table</option>
        <option value="code">Code — JP + subs</option>
        <option value="barcode">Barcode label</option>
        <option value="chart">Signal chart</option>
      </select>
    </div>

    <div class="grp">
      <label class="lbl">Seed</label>
      <div class="row" style="margin-bottom:6px">
        <input type="text" id="seed" value="0079">
        <button id="lock" title="Lock seed" style="flex:0 0 40px">🔓</button>
      </div>
      <button class="primary" id="gen" style="width:100%">⟳ Generate</button>
    </div>

    <div class="grp">
      <label class="lbl">Export</label>
      <div class="row">
        <button id="dlsvg">↓ SVG</button>
        <button id="dlpng">↓ PNG 2×</button>
      </div>
      <div class="hint">SVG keeps live, editable text. PNG rasterises at 2× for pixel-perfect sharing.</div>
    </div>

    <div class="grp">
      <label class="lbl">Symbols — click to toggle</label>
      <div class="symgrid" id="symgrid"></div>
      <label class="lbl" style="margin-top:12px">Add your own vector</label>
      <input type="text" id="symname" placeholder="name" style="margin-bottom:5px">
      <textarea id="sympaste" placeholder="Paste raw &lt;svg&gt;…&lt;/svg&gt; here"></textarea>
      <div class="row" style="margin-top:5px">
        <button id="symadd">+ Add</button>
        <button id="symexport">Export</button>
      </div>
      <div class="hint">Accepts path / rect / circle / line / polyline / polygon. Saved to this browser; Export copies JSON to paste into the file permanently.</div>
    </div>
  </aside>

  <main class="stage">
    <div id="out"></div>
    <div class="meta" id="meta"></div>
  </main>
</div>

/* ---------- seeded RNG (mulberry32) ---------- */
function makeRng(seed){
  let a = seed >>> 0;
  const r = () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  r.pick   = arr => arr[Math.floor(r() * arr.length)];
  r.int    = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.chance = p => r() < p;
  r.some   = (arr, n) => { const c = arr.slice(); const o = [];
    while (o.length < n && c.length) o.push(c.splice(Math.floor(r() * c.length), 1)[0]);
    return o; };
  return r;
}
const hashSeed = s => { let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0; };

/* ---------- symbol store (curation) ---------- */
const LS = 'specforge.symbols.v2';
let SYMBOLS = [];

/* A symbol is an `icon` (square-ish, fits the header/corner slots) or a
   `mark` (a wide logotype, which would be illegible crushed into a 11px
   slot — so it gets used as a brand stamp sized to the column instead). */
const roleFor = vb => { const a = vb.w / vb.h; return (a > 1.8 || a < 0.55) ? 'mark' : 'icon'; };

/* Normalise every authoring/persisted shape into one internal form:
   { vbox, paths:[{d, filled, stroked, tone, rule}] } */
function normalize(s) {
  const vbox = s.vbox || (typeof s.vb === 'number' ? { x:0, y:0, w:s.vb, h:s.vb } : { x:0, y:0, w:24, h:24 });
  const mk = p => ({
    d: p.d,
    filled: !!p.filled,
    stroked: p.stroked !== undefined ? !!p.stroked : !p.filled,  // outline icons stroke by default
    tone: p.tone || 'ink',
    rule: p.rule || 'nonzero',
  });
  const paths = s.paths ? s.paths.map(mk)
    : (s.d || []).map(d => mk({ d, filled: !!s.filled, rule: s.rule }));
  return { id:s.id, name:s.name, vbox, paths, role: s.role || roleFor(vbox) };
}
function loadSymbols(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(LS) || '{}'); } catch(e){}
  const custom = (saved.custom || []).map(normalize);
  const off = new Set(saved.off || []);
  SYMBOLS = [...BUILT_IN.map(normalize), ...custom]
    .map(s => ({ ...s, on: !off.has(s.id), custom: custom.some(c => c.id === s.id) }));
}
function saveSymbols(){
  localStorage.setItem(LS, JSON.stringify({
    custom: SYMBOLS.filter(s => s.custom).map(({id,name,vbox,paths,role}) => ({id,name,vbox,paths,role})),
    off: SYMBOLS.filter(s => !s.on).map(s => s.id),
  }));
}
const pool = role => {
  const on = SYMBOLS.filter(s => s.on && s.role === role);
  return on.length ? on : BUILT_IN.map(normalize).filter(s => s.role === role);
};
const activeIcons = () => pool('icon');
const activeMarks = () => SYMBOLS.filter(s => s.on && s.role === 'mark');

/* symbol -> svg group. Stroke width is divided by the scale so every symbol
   keeps the same optical line weight whatever its source viewBox.
   tone:'bg' fills with the page colour — that's how a knockout/outline
   variant stays readable on any palette. */
function symPaths(sym, ink, bg, sw, k) {
  return sym.paths.map(p => {
    const fill = p.filled ? (p.tone === 'bg' ? bg : ink) : 'none';
    const fr = p.filled && p.rule !== 'nonzero' ? ` fill-rule="${p.rule}"` : (p.filled ? ` fill-rule="${p.rule}"` : '');
    const st = p.stroked
      ? ` stroke="${ink}" stroke-width="${(sw / k).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"` : '';
    return `<path d="${p.d}" fill="${fill}"${fr}${st}/>`;
  }).join('');
}
const symWrap = (sym, x, y, k, t, sw) => {
  const { x:vx, y:vy } = sym.vbox;
  return `<g transform="translate(${x} ${y}) scale(${k.toFixed(5)}) translate(${-vx} ${-vy})">${symPaths(sym, t.ink, t.bg, sw, k)}</g>`;
};
/* fit inside a size×size box (icons) */
function symSvg(sym, x, y, size, t, sw = 1.4) {
  return symWrap(sym, x, y, size / Math.max(sym.vbox.w, sym.vbox.h), t, sw);
}
/* fit to an exact width (marks / logotypes) */
function symSvgW(sym, x, y, width, t, sw = 1.2) {
  return symWrap(sym, x, y, width / sym.vbox.w, t, sw);
}

/* ---------- rough (hand-drawn) primitives ---------- */
function rline(r, x1, y1, x2, y2, amp = 0.55) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const steps = Math.max(2, Math.round(len / 22));
  const nx = -dy / len, ny = dx / len;
  let d = `M${x1.toFixed(1)} ${y1.toFixed(1)}`;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const k = (i === steps) ? 0.25 : 1;            // settle onto the endpoint
    const o = (r() - 0.5) * 2 * amp * k;
    d += ` L${(x1 + dx * t + nx * o).toFixed(1)} ${(y1 + dy * t + ny * o).toFixed(1)}`;
  }
  return d;
}
const rrect = (r, x, y, w, h, amp = 0.55) =>
  [rline(r,x,y,x+w,y,amp), rline(r,x+w,y,x+w,y+h,amp), rline(r,x+w,y+h,x,y+h,amp), rline(r,x,y+h,x,y,amp)].join(' ');

/* ---------- text measuring ---------- */
const _m = document.createElement('canvas').getContext('2d');
function textW(str, size, family, weight = 400, track = 0) {
  _m.font = `${weight} ${size}px ${family}`;
  return _m.measureText(str).width + track * Math.max(0, String(str).length - 1);
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const T = (x, y, s, o = {}) => {
  const { size = 9, fam = F_MONO, w = 400, fill = '#000', track = 0, anchor = 'start' } = o;
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${fam}" font-size="${size}" font-weight="${w}" fill="${fill}"` +
    (track ? ` letter-spacing="${track}"` : '') + (anchor !== 'start' ? ` text-anchor="${anchor}"` : '') + `>${esc(s)}</text>`;
};

/* ============================================================
   MODULES — each returns { svg, h }
   ============================================================ */
function modHeader(r, x, y, w, t) {
  const s = [];
  const sym = r.pick(activeIcons());
  s.push(symSvg(sym, x, y - 8, 11, t, 1.5));
  let cx = x + 15;
  const co = `©${r.pick(W.co)}`;
  s.push(T(cx, y, co, { size: 8.5, fill: t.ink, track: 0.4 }));
  cx += textW(co, 8.5, F_MONO, 400, 0.4) + 7;
  if (r.chance(0.4)) s.push(T(cx, y, r.pick(W.jp), { size: 8.5, fam: F_CJK, fill: t.ink }));

  // right-hand tag: filled chip or hairline chip
  const tag = r.pick(W.tag);
  const tw = textW(tag, 7.5, F_MONO, 400, 0.6) + 10;
  const tx = x + w - tw, ty = y - 8;
  if (r.chance(0.5)) {
    s.push(`<rect x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${tw.toFixed(1)}" height="11" fill="${t.ink}"/>`);
    s.push(T(tx + tw / 2, y, tag, { size: 7.5, fill: t.bg, track: 0.6, anchor: 'middle' }));
  } else {
    s.push(`<path d="${rrect(r, tx, ty, tw, 11, 0.35)}" fill="none" stroke="${t.ink}" stroke-width="0.9"/>`);
    s.push(T(tx + tw / 2, y, tag, { size: 7.5, fill: t.ink, track: 0.6, anchor: 'middle' }));
  }
  return { svg: s.join(''), h: 16 };
}

function modDim(r, x, y, w, t, label) {
  const s = [`<path d="${rline(r, x, y, x + w, y, 0.4)}" fill="none" stroke="${t.ink}" stroke-width="0.9"/>`];
  s.push(`<path d="M${x} ${y-3.5}V${y+3.5}M${x+w} ${y-3.5}V${y+3.5}" stroke="${t.ink}" stroke-width="0.9"/>`);
  if (label) {
    const lw = textW(label, 7.5, F_MONO) + 10;
    s.push(`<rect x="${(x + w/2 - lw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" width="${lw.toFixed(1)}" height="10" fill="${t.bg}"/>`);
    s.push(T(x + w/2, y + 2.5, label, { size: 7.5, fill: t.ink, anchor: 'middle' }));
  }
  return { svg: s.join(''), h: 10 };
}

function modStatus(r, x, y, w, t) {
  const str = r.pick(W.status);
  // wide tracking, but never wider than the column
  const track = Math.min(7, Math.max(1.5, (w * 0.82 - textW(str, 8, F_MONO)) / Math.max(1, str.length - 1)));
  return { svg: T(x, y, str, { size: 8, fill: t.ink, track, fill: t.ink }), h: 12 };
}

function modTitle(r, x, y, w, t, txt) {
  const str = txt || (r.chance(0.3) ? r.pick(W.code) : r.pick(W.title));
  let size = 34;
  while (textW(str, size, F_DISP, 700) > w && size > 12) size -= 1;   // never overflow the card
  return { svg: T(x, y + size * 0.78, str, { size, fam: F_DISP, w: 700, fill: t.ink, track: -0.4 }), h: size * 0.78 + 8 };
}

function modJP(r, x, y, w, t, big) {
  const size = big ? 22 : 13;
  return { svg: T(x, y + size * 0.85, r.pick(W.jp), { size, fam: F_CJK, w: big ? 700 : 400, fill: t.ink }), h: size + 6 };
}

function modPills(r, x, y, w, t) {
  const s = [];
  let cx = x;
  for (const p of r.some(W.tag, r.int(2, 3))) {
    const pw = textW(p, 7.5, F_MONO, 400, 0.5) + 16;
    if (cx + pw > x + w) break;
    s.push(`<rect x="${cx.toFixed(1)}" y="${y.toFixed(1)}" width="${pw.toFixed(1)}" height="15" rx="7.5" fill="none" stroke="${t.ink}" stroke-width="0.9"/>`);
    s.push(T(cx + pw / 2, y + 10.5, p, { size: 7.5, fill: t.ink, track: 0.5, anchor: 'middle' }));
    cx += pw + 6;
    if (cx + 8 < x + w) { s.push(T(cx - 3.5, y + 10.5, '/', { size: 7.5, fill: t.ink, anchor: 'middle' })); cx += 4; }
  }
  return { svg: s.join(''), h: 21 };
}

/* Brand stamp — a wide logotype sized to the column, so it stays legible
   instead of being crushed into an icon slot. */
function modMark(r, x, y, w, t) {
  const marks = activeMarks();
  if (!marks.length) return { svg: '', h: 0 };
  const m = r.pick(marks);
  const mw = w * (0.34 + r() * 0.26);
  const mh = m.vbox.h * (mw / m.vbox.w);
  const mx = r.chance(0.25) ? x + w - mw : x;          // usually left, sometimes right-aligned
  return { svg: symSvgW(m, mx, y, mw, t, 1.1), h: mh + 8 };
}

function modSubs(r, x, y, w, t, n) {
  const s = [];
  for (let i = 0; i < n; i++) s.push(T(x, y + i * 11.5, subLine(r), { size: 8, fill: t.ink }));
  return { svg: s.join(''), h: n * 11.5 + 2 };
}

function modTable(r, x, y, w, t, rows) {
  const s = [];
  const rh = 13, cw = w * 0.5;
  s.push(`<path d="${rrect(r, x, y, w, rows * rh, 0.4)}" fill="none" stroke="${t.ink}" stroke-width="0.9"/>`);
  s.push(`<path d="${rline(r, x + cw, y, x + cw, y + rows * rh, 0.4)}" fill="none" stroke="${t.ink}" stroke-width="0.9"/>`);
  for (let i = 0; i < rows; i++) {
    const ry = y + i * rh;
    if (i) s.push(`<path d="${rline(r, x, ry, x + w, ry, 0.35)}" fill="none" stroke="${t.ink}" stroke-width="0.7"/>`);
    s.push(T(x + 5, ry + 9, r.pick(W.key), { size: 7, fill: t.ink }));
    s.push(T(x + cw + 5, ry + 9, r.pick(W.val), { size: 7, fill: t.ink }));
  }
  return { svg: s.join(''), h: rows * rh + 6 };
}

function modBarcode(r, x, y, w, t) {
  const s = [];
  let cx = x;
  while (cx < x + w - 2) {
    const bw = r.chance(0.25) ? 2.6 : (r.chance(0.5) ? 1.5 : 0.9);
    if (r.chance(0.62)) s.push(`<rect x="${cx.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="34" fill="${t.ink}"/>`);
    cx += bw + r.pick([0.9, 1.4, 2.1]);
  }
  s.push(T(x, y + 45, `${r.int(1000,9999)} ${r.int(10000,99999)}`, { size: 8, fill: t.ink, track: 1 }));
  return { svg: s.join(''), h: 52 };
}

function modSpark(r, x, y, w, t) {
  const s = [];
  const h = 56, n = r.int(9, 16);
  s.push(`<path d="M${x} ${y+h*0.5}H${x+w}" stroke="${t.ink}" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.5"/>`);
  const pts = Array.from({ length: n }, (_, i) => [x + (w / (n - 1)) * i, y + h * (0.18 + r() * 0.64)]);
  s.push(`<path d="M${pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('L')}" fill="none" stroke="${t.ink}" stroke-width="1.1"/>`);
  const p2 = Array.from({ length: n }, (_, i) => [x + (w / (n - 1)) * i, y + h * (0.18 + r() * 0.64)]);
  s.push(`<path d="M${p2.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('L')}" fill="none" stroke="${t.ink}" stroke-width="0.7" stroke-dasharray="3 2" opacity="0.65"/>`);
  pts.forEach(p => s.push(`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.1" fill="${t.ink}"/>`));
  return { svg: s.join(''), h: h + 8 };
}

/* ============================================================
   CARD — compose modules by archetype, height driven by content
   ============================================================ */
function buildCard(r, cw, t, archetype) {
  const P = 24, x = P, w = cw - P * 2;
  let y = P + 8;
  const s = [];
  const add = m => { s.push(m.svg); y += m.h; };

  add(modHeader(r, x, y, w, t));
  y += 4;

  switch (archetype) {
    case 'brief':
      add(modDim(r, x, y + 2, w, t, r.chance(0.4) ? `FREQ ${r.int(90,480)}HZ` : null)); y += 4;
      add(modStatus(r, x, y, w, t));
      add(modTitle(r, x, y, w, t));
      add(modPills(r, x, y, w, t));
      break;
    case 'spec':
      if (r.chance(0.7)) add(modJP(r, x, y, w, t, false));
      add(modTitle(r, x, y, w, t)); y += 2;
      add(modTable(r, x, y, w, t, r.int(3, 5)));
      break;
    case 'code':
      add(modJP(r, x, y, w, t, true)); y += 2;
      add(modDim(r, x, y + 2, w, t, null)); y += 6;
      add(modSubs(r, x, y, w, t, r.int(2, 3)));
      break;
    case 'barcode':
      add(modTitle(r, x, y, w, t, r.pick(W.code))); y += 2;
      add(modBarcode(r, x, y, w, t)); y += 2;
      add(modSubs(r, x, y, w, t, 2));
      break;
    case 'chart':
      add(modJP(r, x, y, w, t, false));
      add(modSpark(r, x, y, w, t)); y += 2;
      add(modDim(r, x, y + 2, w, t, `LAT ${r.int(20,99)}MS`)); y += 6;
      add(modSubs(r, x, y, w, t, 1));
      break;
  }

  // brand stamp, when any wide logotype is enabled
  if (activeMarks().length && r.chance(0.4)) { y += 6; add(modMark(r, x, y, w, t)); }

  const ch = y + P;

  // frame
  const frame = r.pick(['box', 'box', 'brackets', 'none']);
  let fs = '';
  if (frame === 'box') {
    fs = `<path d="${rrect(r, 6, 6, cw - 12, ch - 12, 0.6)}" fill="none" stroke="${t.ink}" stroke-width="1"/>`;
  } else if (frame === 'brackets') {
    const L = 26, o = 6, X2 = cw - o, Y2 = ch - o;
    fs = `<path d="M${o} ${o+L}V${o}H${o+L} M${X2-L} ${o}H${X2}V${o+L} M${X2} ${Y2-L}V${Y2}H${X2-L} M${o+L} ${Y2}H${o}V${Y2-L}"
           fill="none" stroke="${t.ink}" stroke-width="1.1"/>`;
  }

  // occasional corner glyph, bottom-right
  let extra = '';
  if (r.chance(0.35)) {
    const sym = r.pick(activeIcons());
    extra = symSvg(sym, cw - P - 22, ch - P - 22, 22, t, 1.2);
  }
  return { svg: fs + s.join('') + extra, w: cw, h: ch };
}

/* ---------- formats ---------- */
const FORMATS = {
  poster: { W: 1080, H: 1080, cardW: 760 },
  wide:   { W: 1600, H: 900,  cardW: 980 },
  tight:  { W: 0,    H: 0,    cardW: 720 },
  sheet:  { W: 1400, H: 1750, cardW: 300 },
};

function renderAsset(seedStr, opts) {
  const r = makeRng(hashSeed(seedStr));
  const pickTheme = () => opts.theme === 'random' ? r.pick(THEMES) : THEMES.find(t => t.id === opts.theme);
  const pickArch  = () => opts.arch === 'random' ? r.pick(['brief','spec','code','barcode','chart']) : opts.arch;
  const f = FORMATS[opts.format];

  if (opts.format === 'sheet') {
    const t = pickTheme();
    const cols = 4, rows = 5, gap = 26, pad = 40;
    const cw = (f.W - pad * 2 - gap * (cols - 1)) / cols;
    const cells = [];
    let maxH = 0;
    for (let i = 0; i < cols * rows; i++) {
      const rr = makeRng(hashSeed(seedStr + '#' + i));
      const c = buildCard(rr, cw, t, opts.arch === 'random' ? rr.pick(['brief','spec','code','barcode','chart']) : opts.arch);
      cells.push(c); maxH = Math.max(maxH, c.h);
    }
    const H = pad * 2 + rows * maxH + gap * (rows - 1);
    const body = cells.map((c, i) => {
      const cx = pad + (i % cols) * (cw + gap), cy = pad + Math.floor(i / cols) * (maxH + gap);
      return `<g transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)})">${c.svg}</g>`;
    }).join('');
    const border = `<path d="${rrect(r, 20, 20, f.W - 40, H - 40, 0.7)}" fill="none" stroke="${t.ink}" stroke-width="1.2"/>`;
    return { svg: wrap(f.W, H, t, border + body), W: f.W, H, theme: t, arch: 'sheet' };
  }

  const t = pickTheme(), arch = pickArch();
  const card = buildCard(r, f.cardW, t, arch);
  if (opts.format === 'tight') {
    const m = 18;
    return { svg: wrap(card.w + m * 2, card.h + m * 2, t, `<g transform="translate(${m} ${m})">${card.svg}</g>`),
             W: card.w + m * 2, H: card.h + m * 2, theme: t, arch };
  }
  const ox = (f.W - card.w) / 2, oy = (f.H - card.h) / 2;
  return { svg: wrap(f.W, f.H, t, `<g transform="translate(${ox.toFixed(1)} ${oy.toFixed(1)})">${card.svg}</g>`),
           W: f.W, H: f.H, theme: t, arch };
}

const wrap = (W, H, t, body) =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">` +
  `<title>SPEC//FORGE asset</title><rect width="${W}" height="${H}" fill="${t.bg}"/>${body}</svg>`;

/* ============================================================
   UI
   ============================================================ */
const $ = id => document.getElementById(id);
let current = null, locked = false;

function opts(){ return { format: $('format').value, theme: $('theme').value, arch: $('arch').value }; }

function generate(newSeed = true) {
  if (newSeed && !locked) $('seed').value = String(Math.floor(Math.random() * 1e6)).padStart(4, '0');
  current = renderAsset($('seed').value || '0', opts());
  $('out').innerHTML = current.svg;
  $('meta').innerHTML = `<b>seed</b> ${$('seed').value} &nbsp;·&nbsp; <b>palette</b> ${current.theme.name} &nbsp;·&nbsp; <b>layout</b> ${current.arch} &nbsp;·&nbsp; <b>${current.W}×${current.H}</b>`;
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const fname = ext => `specforge_${$('seed').value}_${current.theme.id}_${current.arch}.${ext}`;

$('dlsvg').onclick = () => download(new Blob([current.svg], { type: 'image/svg+xml;charset=utf-8' }), fname('svg'));

$('dlpng').onclick = async () => {
  const scale = 2;
  const blob = new Blob([current.svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const c = document.createElement('canvas');
  c.width = current.W * scale; c.height = current.H * scale;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  c.toBlob(b => download(b, fname('png')), 'image/png');
};

/* ---------- symbol panel ---------- */
function renderSymbols() {
  $('symgrid').innerHTML = SYMBOLS.map(s => {
    const { x, y, w, h } = s.vbox;
    const k = 24 / Math.max(w, h);              // keep preview line weight consistent
    return `<div class="sym" data-id="${s.id}" data-on="${s.on ? 1 : 0}" title="${s.name}${s.role === 'mark' ? ' (wordmark)' : ''}">
       <svg viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="xMidYMid meet">${symPaths(s, '#e6ebf2', '#0e1116', 1.5, k)}</svg>
       ${s.custom ? '<div class="x" data-del="1">×</div>' : ''}
     </div>`;
  }).join('');
}
$('symgrid').onclick = e => {
  const cell = e.target.closest('.sym'); if (!cell) return;
  const s = SYMBOLS.find(v => v.id === cell.dataset.id);
  if (e.target.dataset.del) { SYMBOLS = SYMBOLS.filter(v => v.id !== s.id); }
  else { s.on = !s.on; }
  saveSymbols(); renderSymbols(); generate(false);
};

/* convert primitive shapes to path data so most icon sets just work */
function shapeToPath(el) {
  const n = el.tagName.toLowerCase(), a = k => parseFloat(el.getAttribute(k) || 0);
  if (n === 'path')     return el.getAttribute('d');
  if (n === 'line')     return `M${a('x1')} ${a('y1')}L${a('x2')} ${a('y2')}`;
  if (n === 'rect')     { const x=a('x'),y=a('y'),w=a('width'),h=a('height'); return `M${x} ${y}h${w}v${h}h${-w}Z`; }
  if (n === 'circle')   { const cx=a('cx'),cy=a('cy'),r=a('r'); return `M${cx-r} ${cy}a${r} ${r} 0 1 0 ${r*2} 0a${r} ${r} 0 1 0 ${-r*2} 0`; }
  if (n === 'ellipse')  { const cx=a('cx'),cy=a('cy'),rx=a('rx'),ry=a('ry'); return `M${cx-rx} ${cy}a${rx} ${ry} 0 1 0 ${rx*2} 0a${rx} ${ry} 0 1 0 ${-rx*2} 0`; }
  if (n === 'polygon' || n === 'polyline') {
    const p = (el.getAttribute('points')||'').trim().split(/[\s,]+/).map(Number);
    let d = ''; for (let i = 0; i < p.length; i += 2) d += (i ? 'L' : 'M') + p[i] + ' ' + p[i+1];
    return d + (n === 'polygon' ? 'Z' : '');
  }
  return null;
}

/* Parse pasted SVG. Mounts it off-screen so getComputedStyle resolves fills
   defined via <style> classes (how Illustrator exports them) rather than
   inline attributes — otherwise filled marks import as empty outlines. */
function parsePasted(raw) {
  const doc = new DOMParser().parseFromString(raw, 'image/svg+xml');
  if (doc.querySelector('parsererror')) throw new Error("Couldn't parse that as SVG.");
  const src = doc.querySelector('svg');
  if (!src) throw new Error('No <svg> element found.');

  const host = document.createElement('div');
  host.setAttribute('style', 'position:absolute;left:-9999px;top:0;width:0;height:0;overflow:hidden');
  const node = document.importNode(src, true);
  host.appendChild(node);
  document.body.appendChild(host);

  const vb = (src.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  const vbox = (vb.length === 4 && vb[2] > 0)
    ? { x: vb[0], y: vb[1], w: vb[2], h: vb[3] }
    : { x: 0, y: 0, w: parseFloat(src.getAttribute('width')) || 24, h: parseFloat(src.getAttribute('height')) || 24 };

  // A rect matching the artboard bounds is Illustrator's frame, not artwork.
  const isArtboard = el => {
    if (el.tagName.toLowerCase() !== 'rect') return false;
    const n = k => parseFloat(el.getAttribute(k) || 0);
    const tol = Math.max(2, vbox.w * 0.02);
    const near = (a, b) => Math.abs(a - b) <= tol;
    return near(n('width'), vbox.w) && near(n('height'), vbox.h) && near(n('x'), vbox.x) && near(n('y'), vbox.y);
  };
  const lum = c => { const m = c.match(/[\d.]+/g); return m ? (0.2126*m[0] + 0.7152*m[1] + 0.0722*m[2]) / 255 : 0; };

  let paths, dropped = 0;
  try {
    paths = [...node.querySelectorAll('path,line,rect,circle,ellipse,polygon,polyline')].map(el => {
      if (isArtboard(el)) { dropped++; return null; }
      const d = shapeToPath(el);
      if (!d) return null;
      const tag = el.tagName.toLowerCase();
      const cs = getComputedStyle(el);
      const isSet = v => !!v && v !== 'none' && v !== 'rgba(0, 0, 0, 0)';
      // open shapes are never fills, whatever the computed value says
      let filled = !(tag === 'line' || tag === 'polyline') && isSet(cs.fill);
      const stroked = isSet(cs.stroke);
      // a light fill is a knockout: it should take the page colour, not the ink
      const tone = filled && lum(cs.fill) > 0.72 ? 'bg' : 'ink';
      return { d, filled, stroked, tone, rule: cs.fillRule || 'nonzero' };
    }).filter(Boolean);
  } finally { host.remove(); }

  if (!paths.length) throw new Error('No drawable shapes found in that SVG.');
  return { vbox, paths, dropped };
}

$('symadd').onclick = () => {
  const raw = $('sympaste').value.trim();
  if (!raw) return alert('Paste some SVG markup first.');
  let parsed;
  try { parsed = parsePasted(raw); } catch (e) { return alert(e.message); }
  const { dropped, ...shape } = parsed;
  const name = ($('symname').value.trim() || 'custom');
  const sym = { ...normalize({ id: 'c_' + Date.now().toString(36), name, ...shape }), on: true, custom: true };
  SYMBOLS.push(sym);
  saveSymbols(); renderSymbols();
  $('sympaste').value = ''; $('symname').value = '';
  if (dropped || sym.role === 'mark') {
    alert(`Added “${name}”.` +
      (dropped ? `\n· dropped ${dropped} artboard frame rect` : '') +
      (sym.role === 'mark' ? `\n· wide aspect → used as a wordmark stamp, not an icon` : ''));
  }
};

$('symexport').onclick = async () => {
  const json = JSON.stringify(SYMBOLS.filter(s => s.custom).map(({ id, name, vbox, paths }) => ({ id, name, vbox, paths })), null, 2);
  try { await navigator.clipboard.writeText(json); alert('Custom symbol JSON copied.\nPaste into BUILT_IN in this file to keep them permanently.'); }
  catch (e) { console.log(json); alert('Clipboard blocked — JSON logged to console.'); }
};

/* ---------- boot ---------- */
THEMES.forEach(t => $('theme').append(new Option(t.name, t.id)));
$('gen').onclick = () => generate(true);
['format','theme','arch'].forEach(id => $(id).onchange = () => generate(false));
$('seed').oninput = () => generate(false);
$('lock').onclick = () => { locked = !locked; $('lock').textContent = locked ? '🔒' : '🔓'; };
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') { e.preventDefault(); generate(true); } });

loadSymbols(); renderSymbols(); generate(false);
</script>
</body>
</html>
